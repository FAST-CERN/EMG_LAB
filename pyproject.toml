[project]
name = "emg-lab"
version = "0.2.0"
description = "Native EMG classroom application with independent application services"
requires-python = ">=3.13,<3.14"
dependencies = [
  "PySide6==6.10.0", "pyqtgraph>=0.13.7,<0.15", "numpy>=2.1,<3", "scipy>=1.14,<2",
  "onnxruntime>=1.23,<2", "onnx>=1.17,<2", "torch>=2.6,<3", "mujoco>=3.3,<4",
  "pillow>=10,<13", "pyusb==1.3.1", "libusb-package==1.0.30.0",
  "pythonnet>=3.0,<4; sys_platform == 'win32'",
  "bsi-pykit-base==0.4.1; sys_platform == 'win32'",
  "bsi-robot-base==0.1.2; sys_platform == 'win32'",
  "bsi-dds==0.1.1; sys_platform == 'win32'",
  "cyclonedds==11.0.1; sys_platform == 'win32'",
]

[dependency-groups]
dev = ["pytest>=9,<10", "ruff>=0.11,<1", "pip>=25,<26"]

[tool.uv]
package = false
cache-dir = ".cache/uv"
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'", "sys_platform == 'win32' and platform_machine == 'AMD64'", "sys_platform == 'darwin' and platform_machine == 'arm64'"]

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform != 'darwin'" }]
bsi-pykit-base = { path = "vendor/wheels/bsi_pykit_base-0.4.1-py3-none-any.whl" }
bsi-robot-base = { path = "vendor/wheels/bsi_robot_base-0.1.2-py3-none-any.whl" }
bsi-dds = { path = "vendor/dds/bsi_dds-0.1.1-py3-none-any.whl" }
cyclonedds = { path = "vendor/dds/cyclonedds-11.0.1-cp313-cp313-win_amd64.whl" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.ruff]
target-version = "py313"
line-length = 100
extend-exclude = ["vendor", "emg_lab/backend/hand/driver"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
